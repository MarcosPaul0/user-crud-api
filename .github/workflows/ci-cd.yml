# =============================================================================
# .github/workflows/ci-cd.yml — Pipeline CI/CD AutoriaStore
# =============================================================================
#
# Estágios:
#   lint   → Valida StyleCop e Sonar (warnings viram erros); bloqueia se houver violações
#   test   → Executa os testes unitários e bloqueia o pipeline se algum falhar
#   build  → Builda a imagem Docker da API e pusha para ghcr.io
#   deploy → Via SSH, faz pull da nova imagem na VPS e recria o container
#
# Triggers:
#   - Push na branch main
#   - Pull Request direcionado à main (somente o estágio build é executado)
#
# Secrets necessários (Settings → Secrets and variables → Actions):
#   VPS_HOST        → IP ou domínio da VPS
#   VPS_USER        → Usuário SSH (ex: deploy)
#   VPS_SSH_KEY     → Chave privada SSH (conteúdo completo do arquivo id_ed25519)
#   VPS_DEPLOY_PATH → Caminho absoluto do diretório de deploy na VPS (ex: /opt/autorialoja)
#   GHCR_TOKEN      → Personal Access Token com escopo read:packages (para pull na VPS)
# =============================================================================

name: CI/CD Pipeline

on:
  push:
    branches:
      - main
#  pull_request:
#    branches:
#      - main

# Permissões mínimas necessárias para o GITHUB_TOKEN publicar no ghcr.io
permissions:
  contents: read
  packages: write

# Cancela runs anteriores do mesmo PR/branch para economizar minutos gratuitos
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Valor inicial — será convertido para lowercase no step abaixo
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}

jobs:
  # ---------------------------------------------------------------------------
  # JOB 1: lint
  # Compila a solução com -warnaserror, forçando StyleCop e SonarAnalyzer a
  # tratar warnings como erros. Bloqueia test/build/deploy se houver violações.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (Analyzers)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restaurar dependências
        run: dotnet restore

      - name: Validar lint (warnings como erros)
        run: dotnet build --no-restore -warnaserror

  # ---------------------------------------------------------------------------
  # JOB 2: test
  # Roda os testes unitários. Bloqueia build e deploy se algum teste falhar.
  # ---------------------------------------------------------------------------
  test:
    needs: lint
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restaurar dependências
        run: dotnet restore tests/UnitTests/AutoriaStore.UnitTests.csproj

      - name: Executar testes unitários
        run: dotnet test tests/UnitTests/AutoriaStore.UnitTests.csproj --no-restore --verbosity normal

  # ---------------------------------------------------------------------------
  # JOB 3: build
  # Builda a imagem Docker e pusha para o GitHub Container Registry (ghcr.io).
  # Executa tanto em push quanto em PR — útil para validar o Dockerfile no PR
  # sem realizar o deploy.
  # ---------------------------------------------------------------------------
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test

    outputs:
      # image_tag  → SHA curto do commit (ex: sha-a1b2c3d)
      # image_name → nome completo da imagem já em lowercase
      image_tag:  ${{ steps.meta.outputs.version }}
      image_name: ${{ env.IMAGE_NAME }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      # Configura o buildx para builds multi-plataforma e cache avançado
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Autentica no ghcr.io usando o GITHUB_TOKEN (sem secret extra necessário)
      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr.io exige letras minúsculas — converte antes de qualquer uso
      - name: Converter IMAGE_NAME para lowercase
        run: echo "IMAGE_NAME=$(echo $IMAGE_NAME | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      # Gera as tags e labels da imagem seguindo boas práticas OCI:
      #   - sha-<curto>  → tag imutável por commit (usada no deploy)
      #   - latest       → tag flutuante (atualizada a cada push na main)
      # IMPORTANTE: sha vem primeiro para que steps.meta.outputs.version
      # retorne o SHA e não "latest"
      - name: Gerar tags e labels da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # Builda e pusha — usa cache do ghcr.io para acelerar builds subsequentes
      - name: Build e Push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          dockerfile: Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}  # Só pusha em push na main, não em PRs
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache em camadas no próprio ghcr.io — economiza tempo de build
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to:   type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max

  # ---------------------------------------------------------------------------
  # JOB 4: deploy
  # Conecta na VPS via SSH, faz pull da nova imagem e recria o container da API.
  # Só executa em push na main (não em PRs) e somente após o build ter sucesso.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy na VPS
    runs-on: ubuntu-latest
    needs: build
    # Garante que deploy só rode em push na main (nunca em PRs)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    environment:
      name: production
      url: https://yourdomain.com  # Substitua pelo domínio real

    steps:
      - name: Checkout do código (para copiar o compose)
        uses: actions/checkout@v4

      # Cria o arquivo de chave SSH e adiciona a VPS ao known_hosts.
      # Necessário para autenticar o rsync no step seguinte.
      - name: Instalar chave SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keygen -l -f ~/.ssh/id_deploy
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      # Copia o docker-compose.prod.yml e a pasta nginx/ para a VPS via rsync.
      # Garante que a VPS sempre use a versão mais recente sem clonar o repo.
      - name: Copiar arquivos para a VPS via rsync
        run: |
          rsync -avz --no-perms \
            -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no" \
            docker-compose.prod.yml \
            nginx/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_DEPLOY_PATH }}/

      # Conecta na VPS via SSH e executa a sequência de deploy:
      #   1. Autentica no ghcr.io com o GHCR_TOKEN
      #   2. Puxa a nova imagem com a tag exata do commit (sha-<commit>)
      #   3. Recria apenas o container da API (--no-deps para não afetar os demais)
      #   4. Remove imagens antigas para liberar espaço em disco
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:            ${{ secrets.VPS_HOST }}
          username:        ${{ secrets.VPS_USER }}
          key:             ${{ secrets.VPS_SSH_KEY }}
          timeout:         60s
          command_timeout: 10m
          script: |
            set -euo pipefail

            # Usa image_name já em lowercase vindo do job build
            IMAGE_NAME="${{ needs.build.outputs.image_name }}"
            IMAGE_TAG="${{ needs.build.outputs.image_tag }}"
            IMAGE_FULL="${IMAGE_NAME}:${IMAGE_TAG}"
            DEPLOY_PATH="${{ secrets.VPS_DEPLOY_PATH }}"

            echo "==> Imagem alvo: ${IMAGE_FULL}"

            echo "==> Autenticando no ghcr.io..."
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io \
              -u ${{ github.actor }} --password-stdin

            echo "==> Fazendo pull da imagem..."
            docker pull "${IMAGE_FULL}"

            echo "==> Atualizando o container da API..."
            cd "${DEPLOY_PATH}"
            export API_IMAGE="${IMAGE_FULL}"

            docker compose -f docker-compose.prod.yml up -d \
              --no-deps \
              --force-recreate \
              api

            echo "==> Removendo imagens antigas..."
            docker image prune -f

            echo "==> Deploy concluído!"
            docker compose -f docker-compose.prod.yml ps api
# =============================================================================
# nginx/nginx.conf — Configuração de Produção AutoriaStore
# =============================================================================
#
# Arquitetura:
#   Internet  →  nginx (porta 443, TLS)  →  api:8080 (Kestrel HTTP interno)
#                nginx (porta 80)        →  redirect 301 para HTTPS
#
# Certificados esperados em /etc/nginx/certs/ (montado via docker-compose):
#   api.autorialoja.crt  → certificado completo (cert + intermediários / full chain)
#   api.autorialoja.key  → chave privada (NUNCA exponha, NUNCA commite no git)
#
# ─────────────────────────────────────────────────────────────────────────────
# Como obter certificados para produção (opções):
# ─────────────────────────────────────────────────────────────────────────────
#
# 1) Let's Encrypt (gratuito, renovação automática):
#    # No host (antes de subir o nginx):
#    certbot certonly --standalone -d api.autorialoja.com.br -d www.api.autorialoja.com.br
#    # Depois copie:
#    cp /etc/letsencrypt/live/api.autorialoja.com.br/fullchain.pem ./certs/api.autorialoja.crt
#    cp /etc/letsencrypt/live/api.autorialoja.com.br/privkey.pem   ./certs/api.autorialoja.key
#
# 2) Certificado auto-assinado (apenas testes — não confiável por browsers):
#    openssl req -x509 -nodes -newkey rsa:4096 -days 365 \
#      -keyout ./certs/api.autorialoja.key \
#      -out    ./certs/api.autorialoja.crt \
#      -subj   "/CN=api.autorialoja.com.br"
#
# 3) CA comercial (DigiCert, Comodo, etc.):
#    Siga as instruções da CA para gerar CSR, receber .crt e .ca-bundle,
#    e depois concatene: cat api.autorialoja.crt ca-bundle.crt > api.autorialoja.crt
# =============================================================================


# Worker processes: 'auto' usa o número de núcleos de CPU disponíveis no container.
# Ideal para performance sem configuração manual.
worker_processes auto;

events {
    # Número máximo de conexões simultâneas por worker.
    # Para produção com tráfego moderado, 1024 é adequado.
    # Aumente para 4096+ em servidores com alto throughput.
    worker_connections 1024;
}

http {
    # =========================================================================
    # Configurações básicas
    # =========================================================================

    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # sendfile: transferência de arquivo via kernel (evita cópias user-space)
    # tcp_nopush: acumula dados antes de enviar (melhor throughput com sendfile)
    # tcp_nodelay: desativa o algoritmo de Nagle para conexões keep-alive
    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;

    # Tempo máximo para manter conexões keep-alive abertas
    keepalive_timeout 65;

    # Oculta a versão do nginx em headers e páginas de erro
    # Reduz informações expostas para atacantes em reconnaissance
    server_tokens off;

    # =========================================================================
    # Compressão Gzip
    #
    # Reduz o tamanho das respostas para conteúdo textual (JSON, HTML, CSS, JS).
    # Importante para APIs que retornam payloads JSON grandes.
    # =========================================================================

    gzip              on;
    gzip_vary         on;          # Adiciona "Vary: Accept-Encoding" no response
    gzip_min_length   1024;        # Não comprime respostas menores que 1KB
    gzip_proxied      any;         # Comprime mesmo respostas de upstream (Kestrel)
    gzip_comp_level   6;           # Nível 6: bom equilíbrio entre CPU e compressão
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml;
    # Nota: text/html já é incluído por padrão pelo nginx, não precisa listar aqui

    # =========================================================================
    # Logging
    # =========================================================================

    # Formato de log com IP real do cliente e X-Forwarded-For
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log  warn;

    # =========================================================================
    # Upstream — ASP.NET Core via Kestrel HTTP
    #
    # 'api' é o nome do serviço no docker-compose.prod.yml.
    # O Docker resolve o hostname 'api' para o IP do container na rede backend.
    # =========================================================================

    upstream api_upstream {
        server api:8080;
        # keepalive: mantém conexões persistentes com o upstream para reduzir
        # overhead de TCP handshake em alta frequência de requisições
        keepalive 32;
    }

    # =========================================================================
    # Map para suporte a WebSocket / SignalR
    #
    # Se a aplicação usar SignalR ou WebSocket, o nginx precisa fazer upgrade
    # da conexão HTTP para WebSocket. Este map cuida disso automaticamente.
    # =========================================================================

    map $http_upgrade $connection_upgrade {
        default  upgrade;
        ''       close;
    }


    # =========================================================================
    # Server Block 1 — HTTP (porta 80)
    #
    # Redireciona TODO o tráfego HTTP para HTTPS com código 301 (permanente).
    # O browser e mecanismos de busca atualizam seus registros para HTTPS.
    # =========================================================================

    server {
        listen 80;

        # TODO: Substitua pelo seu domínio real
        server_name api.autorialoja.com.br www.api.autorialoja.com.br;

        # Webroot ACME challenge — Let's Encrypt precisa acessar este path via HTTP.
        # O certbot escreve os tokens em /var/www/certbot (volume compartilhado).
        # Esta location DEVE vir antes do redirect para HTTPS.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect permanente: preserva o path e query string originais
        location / {
            return 301 https://$host$request_uri;
        }
    }


    # =========================================================================
    # Server Block 2 — HTTPS (porta 443)
    #
    # Servidor principal de produção com SSL termination.
    # O nginx desencripta o TLS e faz proxy para o Kestrel via HTTP interno.
    # =========================================================================

    server {
        listen 443 ssl;
        http2  on;    # HTTP/2 para melhor performance (multiplexing, header compression)

        # TODO: Substitua pelo seu domínio real
        server_name api.autorialoja.com.br www.api.autorialoja.com.br;

        # ------------------------------------------------------------------
        # Certificados SSL
        #
        # Montados em /etc/nginx/certs/ via volume no docker-compose.prod.yml.
        # TODO: Substitua pelos nomes reais dos seus arquivos de certificado
        # ------------------------------------------------------------------

        # Certificados gerados pelo certbot — montados via ./certbot/conf:/etc/letsencrypt
        ssl_certificate     /etc/letsencrypt/live/api.autorialoja.com.br/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.autorialoja.com.br/privkey.pem;

        # ------------------------------------------------------------------
        # Configuração de protocolos e cifras SSL
        #
        # Somente TLS 1.2 e 1.3 — versões mais antigas são inseguras:
        #   TLS 1.0: vulnerável a BEAST, POODLE
        #   TLS 1.1: depreciado pelo IETF (RFC 8996)
        # ------------------------------------------------------------------

        ssl_protocols TLSv1.2 TLSv1.3;

        # Suíte de cifras Mozilla Intermediate (compatibilidade + segurança moderna).
        # Cobre Chrome 60+, Firefox 57+, IE 11 no Win10+, Edge 15+, Safari 11+.
        # Veja: https://ssl-config.mozilla.org/#server=nginx&config=intermediate
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;

        # off: deixa o cliente escolher a cifra (melhor prática para TLS 1.3)
        ssl_prefer_server_ciphers off;

        # Session cache: evita full handshake em reconexões (melhora performance)
        ssl_session_cache   shared:SSL:10m;  # Cache de 10MB compartilhado entre workers
        ssl_session_timeout 1d;
        ssl_session_tickets off;             # Desabilitado para garantir forward secrecy

        # OCSP Stapling: o nginx busca e inclui a validade do certificado na resposta TLS,
        # evitando que o cliente faça uma request separada para o servidor OCSP da CA.
        # Isso melhora performance e privacidade do cliente.
        ssl_stapling        on;
        ssl_stapling_verify on;

        # ------------------------------------------------------------------
        # Limite de tamanho do body
        #
        # 20M é adequado para uploads de imagens de produtos.
        # Ajuste conforme necessário para seu caso de uso.
        # ------------------------------------------------------------------

        client_max_body_size 20M;

        # ------------------------------------------------------------------
        # Security Headers
        #
        # Instruções ao browser para se proteger de ataques comuns.
        # 'always' garante que o header seja enviado mesmo em respostas de erro.
        # ------------------------------------------------------------------

        # Impede clickjacking: bloqueia embedding da página em iframes de outros domínios.
        # SAMEORIGIN permite iframes do mesmo domínio (mais flexível que DENY).
        add_header X-Frame-Options "SAMEORIGIN" always;

        # Impede MIME type sniffing: o browser DEVE usar o Content-Type declarado.
        # Evita que scripts disfarçados de outros tipos sejam executados.
        add_header X-Content-Type-Options "nosniff" always;

        # Filtro XSS do browser (legacy — Chrome removeu, mas útil para IE/Edge antigos).
        add_header X-XSS-Protection "1; mode=block" always;

        # HSTS: força HTTPS por 1 ano (31536000 segundos), incluindo subdomínios.
        # WARNING: Uma vez enviado com max-age alto, reverter para HTTP é muito difícil.
        # Certifique-se de que HTTPS está funcionando perfeitamente antes de ativar.
        # TODO: Remova 'preload' se não planeja submeter o domínio ao preload list.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Controla informações de origem (Referer) enviadas para outros sites.
        # strict-origin-when-cross-origin: envia origin apenas em requests cross-origin
        # via HTTPS; não envia nada em downgrade (HTTPS → HTTP).
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ------------------------------------------------------------------
        # Proxy para a API ASP.NET Core
        # ------------------------------------------------------------------

        location / {
            proxy_pass http://api_upstream;

            # Host original: necessário para que o ASP.NET gere URLs corretas
            # e para que o middleware de CORS funcione adequadamente
            proxy_set_header Host              $host;

            # IP real do cliente (disponível via HttpContext.Connection.RemoteIpAddress
            # quando ForwardedHeaders middleware está configurado no ASP.NET)
            proxy_set_header X-Real-IP         $remote_addr;

            # Cadeia completa de proxies (suporta múltiplos proxies intermediários)
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

            # Esquema original (https): necessário para que UseHttpsRedirection
            # e cookies com Secure flag funcionem corretamente no ASP.NET
            proxy_set_header X-Forwarded-Proto $scheme;

            # Suporte a WebSocket / SignalR (usa o map definido acima)
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # HTTP/1.1 obrigatório para keep-alive e WebSocket com o upstream
            proxy_http_version 1.1;

            # Timeouts — ajuste conforme o tempo máximo esperado para as suas rotas
            proxy_connect_timeout 60s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;

            # Buffering de resposta: o nginx armazena a resposta do upstream antes
            # de enviar ao cliente, liberando o Kestrel mais rapidamente para outras
            # requisições (benéfico para clientes lentos)
            proxy_buffering    on;
            proxy_buffer_size  4k;
            proxy_buffers      8 4k;
        }
    }
}
